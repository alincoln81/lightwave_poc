<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vixi Light Show - 500</title>
    <!--<link rel="icon" type="image/png" href="/assets/images/favicon.png">-->
	<style>
		:root {
			--bg: #1b1b1b;
			--card: rgba(255,255,255,0.06);
			--border: rgba(255,255,255,0.12);
			--text: #e6e6e6;
			--muted: #a8b3cf;
			--accent: #22d3ee;
			--accent-600: #06b6d4;
			--shadow: 0 10px 30px rgba(0,0,0,0.35);
		}

		* { box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			margin: 0;
			background: radial-gradient(1200px 600px at 30% -10%, rgba(0, 15, 17, 0.174), transparent 60%),
						radial-gradient(1000px 500px at 100% 0%, rgba(0, 15, 17, 0.174), transparent 60%),
						var(--bg);
			color: var(--text);
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}

		.card {
			width: 100%;
			max-width: 560px;
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 16px;
			box-shadow: var(--shadow);
			backdrop-filter: blur(6px);
			padding: 28px;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 12px;
			color: var(--muted);
			font-weight: 600;
			letter-spacing: 0.3px;
		}
        .brand img {
            text-align: center;
            margin: 0 auto;
            height: auto;
            width: 90%;
        }
		.title {
			margin: 20px auto 0 auto;
			font-size: 22px;
			font-weight: 700;
            text-align: center;
		}

		.desc {
			margin: 8px 0 18px;
			color: var(--muted);
			line-height: 1.6;
			font-size: 15px;
            text-align: center;
		}

		.hint { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; }

		@media (prefers-reduced-motion: reduce) {
			.btn { transition: none; }
		}
	</style>
</head>
<body>
	<main class="card" role="main" aria-labelledby="error-title">
		<div class="brand">
			<!--<img src="/assets/images/logo.png" alt="Vixi">-->
		</div>
		<h1 id="error-title" class="title">Something went wrong</h1>
		<p class="desc">Please check the URL and try again.</p>

		<p class="hint">If the issue persists, please reach out to support.</p>
	</main>
</body>
</html>
